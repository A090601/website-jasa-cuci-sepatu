[phases.setup]
nixpacksArchive = true

[phases.build]
cmds = ['npm install', 'npm run build', 'php artisan optimize']

[start]
cmd = 'node_modules/.bin/nixpacks-php-entrypoint'

[envs]
# Dipaksa ke 40M agar sinkron dengan batasan 40960 di Laravel Anda
PHP_UPLOAD_MAX_FILESIZE = "40M"
PHP_POST_MAX_SIZE = "40M"
PHP_MEMORY_LIMIT = "512M"
